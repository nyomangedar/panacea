services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: panacea
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - panacea

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - panacea

  traefik:
    image: traefik:v3
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - panacea

  backend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/shell/node_modules
      - /app/packages/shared/node_modules
      - /app/packages/ui/node_modules
    command: sh -c "corepack enable && pnpm install && pnpm --filter @panacea/shell dev"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/panacea
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret
      PORT: 3000
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    networks:
      - panacea

  worker:
    image: node:20-alpine
    command: ["echo", "worker — not yet implemented"]
    networks:
      - panacea

networks:
  panacea:
    driver: bridge

volumes:
  postgres_data:
